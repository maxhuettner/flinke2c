# =============================================================================
# Common
# =============================================================================
parallelism:
  default: 1

io:
  tmp:
    dirs: /tmp


pipeline.operator-chaining.enabled: false

# =============================================================================
# JobManager (Coordinator)
# =============================================================================
jobmanager:
  bind-host: 0.0.0.0
  rpc:
    address: 10.10.2.181
    port: 6123
  memory:
    process:
      size: 8G

# =============================================================================
# TaskManager (only relevant if you also run a TM on this node)
# =============================================================================
taskmanager:
  memory:
    process:
      size: 8G
  numberOfTaskSlots: 2

# =============================================================================
# REST
# =============================================================================
rest:
  address: 0.0.0.0
  bind-address: 0.0.0.0
  port: 8081

topology:
  graphml:
    # Generated at cluster bootstrap by scripts/bench-cluster.sh + generate-graphml.py.
    # Lives outside the git repo so per-cluster bench results don't pollute the branch.
    path: /mnt/labstore/aelmansoury/conf/cloud.graphml

cluster:
  placement-method: BOTTOM_UP
  placement:
    capability-sort: true

# =============================================================================
# JVM
# =============================================================================
env:
  java:
    opts:
      all: >-
        -verbose:gc -XX:NewRatio=3 -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:ParallelGCThreads=4 --add-opens=java.base/java.util=ALL-UNNAMED
      jobmanager: >-
        -Xloggc:$FLINK_LOG_DIR/jobmanager-gc.log
        -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=2 -XX:GCLogFileSize=512M
      taskmanager: >-
        -Xloggc:$FLINK_LOG_DIR/taskmanager-gc.log
        -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=2 -XX:GCLogFileSize=512M

# =============================================================================
# State & Checkpoint
# =============================================================================
state:
  backend:
    type: rocksdb
    incremental: true
    local-recovery: true
  checkpoints:
    dir: file:///mnt/labstore/aelmansoury/flinke2c/checkpoint

# RocksDB local dir is still commonly configured as a flat key.
state.backend.rocksdb.localdir: /tmp

execution:
  checkpointing:
    interval: 180000
    mode: EXACTLY_ONCE
    # disable final checkpoint to avoid test waiting for the last checkpoint complete
    checkpoints-after-tasks-finish:
      enabled: false

# =============================================================================
# Runtime Others (Table)
# =============================================================================
table:
  exec:
    mini-batch:
      enabled: true
      allow-latency: 2s
      size: 50000
  optimizer:
    distinct-agg:
      split:
        enabled: true